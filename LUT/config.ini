# Settings for build_lut.py. Relative paths are resolved against this file's directory.

[grid]
# North-up grid in degrees; (x0, y0) is the top-left corner, dx/dy are positive cell sizes.
# Defaults match the MRMS CONUS grid (GDAL geotransform of RadarOnly_QPE_01H_00.00).
nx = 7000
ny = 3500
dx = 0.01
dy = 0.01
x0 = -130.0
y0 = 55.0

[features]
# Polygon shapefile to rasterise onto the grid, and the attribute holding each feature's ID
shapefile = HUC12/huc12.shp
id_field = HUC_12